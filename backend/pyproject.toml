[project]
name = "backend"
version = "0.1.0"
description = "Prelegal API (FastAPI)"
readme = "README.md"
authors = [
    { name = "Jake", email = "abellajakeyabut@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
    "litellm>=1.109.1",
    "pydantic-settings>=2.16.2",
]

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# LiteLLM's own TypedDicts trigger this pydantic warning; it is not from our code.
filterwarnings = ["ignore:Items? '.*' on TypedDict class .*ReadOnly:UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
